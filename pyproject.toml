[project]
name = "din"
version = "0.1.0"
description = "Agua US data ingestion demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-core",
  "dbt-duckdb",
  "duckdb",
  "pandas",
  "requests",
  "python-dotenv",
  "plotly",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/din"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
