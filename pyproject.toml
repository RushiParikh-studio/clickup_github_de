[project]
name = "din"
version = "0.1.0"
description = "Agua US data ingestion demo"
requires-python = "==3.12.*"
dependencies = [
  "dbt-core",
  "dbt-duckdb",
  "duckdb",
  "pandas",
  "requests",
  "python-dotenv",
  "plotly",
]

[dependency-groups]
dev = ["ruff", "pytest", "pre-commit"]

[tool.uv]
python-preference = "managed"
python-downloads = "automatic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/din", "extract", "publish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python = ".venv"
