name: link-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require a DIN id in branch or PR title
        if: github.actor != 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s\n%s\n' "$HEAD_REF" "$PR_TITLE" | grep -qE 'DIN-[0-9]+'; then
            echo "Found a DIN id."
          else
            echo "::error::No DIN-n id in the branch name or PR title."
            echo "Create the branch from the ClickUp task (Task > Git > Create branch) so it starts with DIN-n/, or put DIN-n in the PR title."
            exit 1
          fi
