name: link-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments "**/*.md"
          fail: true
          failIfEmpty: false
