name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task_id:
        description: "ClickUp custom task id, e.g. DIN-202, used when the run is not triggered by a push"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      CLICKUP_DOC_ID: 2kydxwy9-1074  # not secrets
      CLICKUP_PAGE_ID: 2kydxwy9-294
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7  # uv reads .python-version + [tool.uv] from pyproject.toml
      - run: uv sync --frozen

      - name: Cache public source files (UCMR 5 zip, ZCTA-county relationship file)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/ucmr5-occurrence-data.zip
            data/raw/tab20_zcta520_county20_natl.txt
          key: raw-sources-v1-${{ hashFiles('extract/ucmr5.py', 'extract/zcta_county.py') }}

      - name: Extract (UCMR 5, ZCTA-county, CBP, ACS)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}  # scoped to this step only
        run: uv run python -m extract --out data/raw

      - name: Load raw tables into the prod DuckDB file
        run: uv run python -m extract.load --src data/raw --db dbt/target/prod.duckdb

      - name: dbt build (prod)
        working-directory: dbt
        run: uv run dbt build --target prod

      - name: Publish top 20 and dashboard
        run: |
          uv run python -m publish.top20 --db dbt/target/prod.duckdb --out docs
          cat docs/top20.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-state
          path: dbt/target/manifest.json
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: published
          path: |
            docs/top20.md
            docs/top20.json
            docs/dashboard.html
          retention-days: 90

      - name: Refresh ClickUp Doc page (top 20)
        continue-on-error: true  # a Doc refresh problem must never fail a deploy
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_TEAM_ID: ${{ vars.CLICKUP_TEAM_ID }}
        run: uv run python -m publish.clickup_doc

      - name: Find DIN id
        id: din
        if: always()
        uses: ./.github/actions/din-id
        with:
          candidates: |
            ${{ inputs.task_id }}
            ${{ github.event.head_commit.message }}

      - name: ClickUp deployed
        id: cu_ok
        continue-on-error: true  # reporting must not fail a good deploy
        if: success() && steps.din.outputs.task_id != ''
        uses: ./.github/actions/clickup
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_TEAM_ID: ${{ vars.CLICKUP_TEAM_ID }}
        with:
          task_id: ${{ steps.din.outputs.task_id }}
          field_id: 598adfb7-d6aa-4763-a608-463f1f63120c
          field_value: 25f48fc4-3b69-40d3-af12-3ddcf6141c9b
          status: done
          comment_prefix: "[Deploy]"
          comment: "[Deploy] Deployed to prod by run ↗ ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: ClickUp deploy failed
        id: cu_fail
        continue-on-error: true
        if: failure() && steps.din.outputs.task_id != ''
        uses: ./.github/actions/clickup
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_TEAM_ID: ${{ vars.CLICKUP_TEAM_ID }}
        with:
          task_id: ${{ steps.din.outputs.task_id }}
          field_id: 598adfb7-d6aa-4763-a608-463f1f63120c
          field_value: 4766d7f8-dced-4a2f-bde6-83a32f8fdd62
          comment_prefix: "[Deploy]"
          comment: "[Deploy] failed ↗ ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notice when no DIN id
        if: always() && steps.din.outputs.task_id == ''
        run: echo "::notice::No DIN id in the task_id input or the head commit message; ClickUp steps skipped."

      - name: ClickUp summary
        if: always()
        env:
          TASK_ID: ${{ steps.din.outputs.task_id }}
          OK_SUCCESS: ${{ steps.cu_ok.outputs.ok }}
          OK_FAIL: ${{ steps.cu_fail.outputs.ok }}
        run: |
          if [ -z "$TASK_ID" ]; then
            echo "ClickUp reporting: skipped (no DIN id)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$OK_SUCCESS" = "true" ] || [ "$OK_FAIL" = "true" ]; then
            echo "ClickUp reporting: ok ($TASK_ID)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ClickUp reporting: skipped or failed ($TASK_ID; token absent or rejected, or API error)" >> "$GITHUB_STEP_SUMMARY"
          fi
